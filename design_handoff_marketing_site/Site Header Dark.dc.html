<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position: relative; z-index: 40;">
  <div style="background: linear-gradient(90deg, #003366 0%, #2E6EA8 20%, #707538 42%, #C9A227 60%, #C4262E 80%, #7A2E6B 100%); padding: 10px 20px; display: flex; align-items: center; justify-content: center; gap: 10px 18px; flex-wrap: wrap; text-align: center;">
    <span style="display: flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; background: rgba(0,0,0,0.26); border: 1px solid rgba(255,255,255,0.32); backdrop-filter: blur(10px);">
      <span style="width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #F4F2AE;"></span>
      <span style="font-family: Lato, sans-serif; font-weight: 700; font-size: 12.5px; letter-spacing: 0.2px; color: #FFFFFF;">Get 49% discount on sign up now</span>
    </span>
    <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.36);"></span>
    <span style="font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.95); text-shadow: 0 1px 4px rgba(0,0,0,0.3);">Go digital with 100,000 business in 2026</span>
  </div>

  <header style="position: sticky; top: 0; background: rgba(0,20,35,0.74); backdrop-filter: blur(26px); border-bottom: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 30px rgba(0,8,18,0.3), inset 0 1px 0 rgba(255,255,255,0.14);">
    <div style="max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; align-items: center; gap: 20px;">
      <a href="Marketing - Home.dc.html" style="flex: 0 0 auto; display: block;"><img src="assets/matjarx-logo-light.png" alt="MatjarX" style="width: 128px; height: auto; display: block;"></a>

      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav style="display: flex; align-items: center; gap: 3px; margin: 0 auto; padding: 5px 5px 5px 9px; border-radius: 999px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(24px); box-shadow: 0 14px 34px rgba(0,8,18,0.32), inset 0 1px 0 rgba(255,255,255,0.16);">
          <sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
            <div style="position: relative;">
              <a href="{{ item.href }}" onClick="{{ item.click }}" style="display: flex; align-items: center; gap: 5px; padding: 9px 15px; border-radius: 999px; font-size: 13.5px; font-weight: {{ item.weight }}; color: {{ item.color }}; white-space: nowrap;" style-hover="background: rgba(255,255,255,0.14); color: #F7FAFD;">
                {{ item.label }}
                <sc-if value="{{ item.hasMenu }}">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: {{ item.rotate }}; transition: transform 180ms ease;"><path d="m6 9 6 6 6-6"></path></svg>
                </sc-if>
              </a>
              <sc-if value="{{ item.open }}">
                <div style="position: absolute; top: calc(100% + 16px); left: -8px; min-width: 250px; padding: 10px; border-radius: 18px; background: rgba(4,24,42,0.94); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(28px); box-shadow: 0 22px 50px rgba(0,8,18,0.5), inset 0 1px 0 rgba(255,255,255,0.14); display: flex; flex-direction: column; gap: 2px;">
                  <sc-for list="{{ item.menu }}" as="m" hint-placeholder-count="4">
                    <a href="{{ m.href }}" style="display: flex; flex-direction: column; gap: 2px; padding: 11px 14px; border-radius: 12px;" style-hover="background: rgba(255,255,255,0.08); color: #F7FAFD;">
                      <span style="font-size: 13.5px; font-weight: 600; color: #F2F6FA;">{{ m.label }}</span>
                      <sc-if value="{{ m.note }}">
                        <span style="font-size: 11.5px; color: rgba(226,236,245,0.5);">{{ m.note }}</span>
                      </sc-if>
                    </a>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-for>
          <a href="#login" title="Log in" style="width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(160deg, #0A4278, #002E5C); box-shadow: 0 8px 18px rgba(0,51,102,0.28), inset 0 1px 0 rgba(255,255,255,0.22);" style-hover="background: #003366; color: #FFFFFF;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#F4F2AE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2ZM5 20a7 7 0 0 1 14 0"></path></svg>
          </a>
        </nav>
        </sc-if>

      <a href="Marketing - Pricing.dc.html" style="flex: 0 0 auto; padding: 11px 20px; border-radius: 999px; font-family: Lato, sans-serif; font-weight: 700; font-size: 13.5px; color: #FFFFFF; background: linear-gradient(160deg, #0A4278, #002E5C); white-space: nowrap; box-shadow: 0 10px 24px rgba(0,51,102,0.26), inset 0 1px 0 rgba(255,255,255,0.22);" style-hover="background: #00274E; color: #FFFFFF;">Get started</a>

      <sc-if value="{{ isMobile }}">
        <button type="button" onClick="{{ toggleDrawer }}" title="Menu" style="all: unset; cursor: pointer; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18); backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#E9EFF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ burgerIcon }}"></path></svg>
        </button>
      </sc-if>
    </div>

    <sc-if value="{{ drawerOpen }}">
      <div style="border-top: 1px solid rgba(255,255,255,0.12); background: rgba(0,20,35,0.92); backdrop-filter: blur(26px); padding: 14px 20px 22px; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;">
        <sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column;">
            <a href="{{ item.href }}" onClick="{{ item.mobileClick }}" style="display: flex; align-items: center; gap: 10px; padding: 15px 14px; border-radius: 13px; font-family: Lato, sans-serif; font-size: 16px; font-weight: {{ item.weight }}; color: {{ item.color }};" style-hover="background: rgba(255,255,255,0.08);">
              <span style="margin-right: auto;">{{ item.label }}</span>
              <sc-if value="{{ item.hasMenu }}">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: {{ item.rotate }}; transition: transform 180ms ease;"><path d="m6 9 6 6 6-6"></path></svg>
              </sc-if>
            </a>
            <sc-if value="{{ item.open }}">
              <div style="display: flex; flex-direction: column; gap: 2px; margin: 2px 0 8px 16px; padding-left: 16px; border-left: 2px solid rgba(198,203,138,0.7);">
                <sc-for list="{{ item.menu }}" as="m" hint-placeholder-count="4">
                  <a href="{{ m.href }}" style="display: block; padding: 12px 12px; border-radius: 11px; font-size: 14.5px; color: rgba(226,236,245,0.76);" style-hover="background: rgba(255,255,255,0.08); color: #F7FAFD;">{{ m.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <a href="#login" style="margin-top: 8px; text-align: center; padding: 15px 18px; border-radius: 13px; font-family: Lato, sans-serif; font-weight: 700; font-size: 15px; color: #F7FAFD; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18); backdrop-filter: blur(20px);" style-hover="border-color: #C6CB8A; color: #F7FAFD;">Log in</a>
      </div>
    </sc-if>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;examples&quot;,&quot;pricing&quot;,&quot;resources&quot;,&quot;company&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: -1, drawer: false, narrow: false };

  componentDidMount() {
    this._mq = window.matchMedia("(max-width: 940px)");
    this._sync = () => this.setState({ narrow: this._mq.matches, open: -1, drawer: false });
    this._sync();
    this._mq.addEventListener
      ? this._mq.addEventListener("change", this._sync)
      : this._mq.addListener(this._sync);
  }

  componentWillUnmount() {
    if (!this._mq) return;
    this._mq.removeEventListener
      ? this._mq.removeEventListener("change", this._sync)
      : this._mq.removeListener(this._sync);
  }

  renderVals() {
    const active = this.props.active ?? "";
    const narrow = this.state.narrow;

    const defs = [
      { label: "Home", href: "Marketing - Home.dc.html", key: "home" },
      { label: "Services", href: "Marketing - Services.dc.html", key: "services", menu: [
        { label: "Done-for-you website", href: "Marketing - Services.dc.html", note: "Built and launched in 7 days" },
        { label: "Local, national & global SEO", href: "Marketing - Services.dc.html", note: "Get found on Google" },
        { label: "Concierge service", href: "Marketing - Services.dc.html", note: "Unlimited edits, done by us" },
        { label: "Growth marketing", href: "Marketing - Services.dc.html", note: "A team that grows your revenue" },
        { label: "Free website audit", href: "Marketing - Website Audit.dc.html", note: "Nine checks, report on your WhatsApp" },
        { label: "Websites for restaurants", href: "Marketing - Website For Industry.dc.html", note: "Bookings, menus and Google Maps" },
        { label: "Websites for boutiques", href: "Marketing - Website For Boutiques.dc.html", note: "Webstore, COD and variants" },
        { label: "Websites for clinics", href: "Marketing - Website For Clinics.dc.html", note: "Appointments and doctor profiles" },
        { label: "Website design Karachi", href: "Marketing - Website Design City.dc.html", note: "Office in Clifton" },
        { label: "Website design Lahore", href: "Marketing - Website Design Lahore.dc.html", note: "" },
        { label: "Website design Islamabad", href: "Marketing - Website Design Islamabad.dc.html", note: "" }
      ] },
      { label: "Website examples", href: "Marketing - Website Examples.dc.html", key: "examples" },
      { label: "Pricing", href: "Marketing - Pricing.dc.html", key: "pricing", menu: [
        { label: "All plans & pricing", href: "Marketing - Pricing.dc.html", note: "Compare the four plans" },
        { label: "Features", href: "Marketing - Features.dc.html", note: "Everything included, by plan" },
        { label: "Launch plan", href: "Marketing - Plan Launch.dc.html", note: "Get online properly, in 7 days" },
        { label: "Boost plan", href: "Marketing - Plan.dc.html", note: "More pages, more SEO, more growth" },
        { label: "Growth plan", href: "Marketing - Plan Growth.dc.html", note: "A marketing team, not just a website" },
        { label: "Platinum plan", href: "Marketing - Plan Platinum.dc.html", note: "A custom store, built to scale" }
      ] },
      { label: "Resources", href: "Marketing - Blog.dc.html", key: "resources", menu: [
        { label: "Blog", href: "Marketing - Blog.dc.html", note: "Guides for Pakistani businesses" },
        { label: "FAQs", href: "Marketing - FAQs.dc.html", note: "" },
        { label: "Help centre", href: "Marketing - Help.dc.html", note: "Guides, and a real person to ask" },
        { label: "Best website builder in Pakistan", href: "Marketing - Best Website Builder Pakistan.dc.html", note: "Every option, side by side" },
        { label: "MatjarX vs Wix", href: "Marketing - vs Wix.dc.html", note: "" },
        { label: "MatjarX vs Squarespace", href: "Marketing - vs Squarespace.dc.html", note: "" },
        { label: "MatjarX vs GoDaddy", href: "Marketing - vs GoDaddy.dc.html", note: "" },
        { label: "Partner program", href: "Marketing - Partner.dc.html", note: "" }
      ] },
      { label: "Company", href: "Marketing - About.dc.html", key: "company", menu: [
        { label: "About us", href: "Marketing - About.dc.html", note: "" },
        { label: "Careers", href: "Marketing - Careers.dc.html", note: "We're hiring in Lahore" },
        { label: "Become a partner", href: "Marketing - Partner.dc.html", note: "" },
        { label: "Get in touch", href: "Marketing - Contact.dc.html", note: "" }
      ] }
    ];

    return {
      isDesktop: !narrow,
      isMobile: narrow,
      drawerOpen: narrow && this.state.drawer,
      toggleDrawer: () => this.setState({ drawer: !this.state.drawer, open: -1 }),
      burgerIcon: this.state.drawer ? "M6 6l12 12M18 6 6 18" : "M4 7h16M4 12h16M4 17h16",

      items: defs.map((d, i) => {
        const isActive = active === d.key;
        const isOpen = this.state.open === i;
        const toggle = (e) => { e.preventDefault(); this.setState({ open: isOpen ? -1 : i }); };
        return {
          label: d.label,
          href: d.href,
          hasMenu: !!d.menu,
          menu: (d.menu || []).map(m => ({ label: m.label, href: m.href, note: m.note })),
          open: isOpen,
          rotate: isOpen ? "rotate(180deg)" : "rotate(0deg)",
          weight: isActive ? 700 : 500,
          color: isActive ? "#F4F2AE" : "rgba(226,236,245,0.78)",
          click: d.menu ? toggle : undefined,
          mobileClick: d.menu ? toggle : undefined
        };
      })
    };
  }
}
</script>
</body>
</html>
